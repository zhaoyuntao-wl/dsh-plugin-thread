name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # During development @thread-memory/core is a file: link to the private
      # main repo (not available in CI), so the chain cannot resolve and is
      # skipped; the local chain (pnpm typecheck && lint && test) covers it.
      # Once core is published to npm and the dependency switches to a version,
      # this guard automatically enables the full chain.
      - name: Check dev-mode dependency (file link)
        id: dev-mode
        run: |
          if grep -q '"@thread-memory/core": "file:' package.json; then
            echo "dev-mode=1" >> "$GITHUB_OUTPUT"
            echo "dev mode: file link - CI skipped"
          else
            echo "dev-mode=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        if: steps.dev-mode.outputs.dev-mode == '0'
        run: pnpm install --frozen-lockfile
      - name: Build
        if: steps.dev-mode.outputs.dev-mode == '0'
        run: pnpm build
      - name: Typecheck
        if: steps.dev-mode.outputs.dev-mode == '0'
        run: pnpm typecheck
      - name: Lint
        if: steps.dev-mode.outputs.dev-mode == '0'
        run: pnpm lint
      - name: Test
        if: steps.dev-mode.outputs.dev-mode == '0'
        run: pnpm test

  # dsh-thread compat matrix (release gate: pin + adapt to the dsh release
  # train). Append new dsh versions here as previews land; the step below
  # installs that exact SDK version before typechecking, so this job really
  # compiles against the matrix entry rather than the lockfile's resolution.
  # 0.1.x entries were dropped with 1.3.0: dsh 0.2.0 replaced the shared
  # 'plugin' message source with per-producer MessageSourceMap kinds, so the
  # source no longer compiles against 0.1.x SDKs.
  compat-dsh:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dsh-version: [0.2.0-rc.2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Check dev-mode dependency (file link)
        id: dev-mode
        run: |
          if grep -q '"@thread-memory/core": "file:' package.json; then
            echo "dev-mode=1" >> "$GITHUB_OUTPUT"
            echo "dev mode: CI skipped until core publishes to npm"
          else
            echo "dev-mode=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        if: steps.dev-mode.outputs.dev-mode == '0'
        run: pnpm install --frozen-lockfile
      - name: Pin SDK to the matrix dsh version
        if: steps.dev-mode.outputs.dev-mode == '0'
        run: |
          pnpm add -D --save-exact \
            "@deepseek-ai/dsh-agent@${DSH_VERSION}" \
            "@deepseek-ai/dsh-compaction@${DSH_VERSION}" \
            "@deepseek-ai/dsh-llm@${DSH_VERSION}" \
            "@deepseek-ai/dsh-session@${DSH_VERSION}" \
            "@deepseek-ai/dsh-tools@${DSH_VERSION}" \
            "@deepseek-ai/dsh-user-questions@${DSH_VERSION}"
        env:
          DSH_VERSION: ${{ matrix.dsh-version }}
      - name: Build
        if: steps.dev-mode.outputs.dev-mode == '0'
        run: pnpm build
      - name: Typecheck against pinned dsh version
        if: steps.dev-mode.outputs.dev-mode == '0'
        run: pnpm typecheck
        env:
          DSH_VERSION: ${{ matrix.dsh-version }}
