name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # 开发期 @thread-memory/core 走 file: link 到私有主仓（CI 环境无主仓），
      # 依赖无法解析，CI 跳过——本地验证链（pnpm typecheck && lint && test）已覆盖。
      # core 发布 npm 版本并切换依赖后，本 guard 自动放行完整链路。
      - name: Check dev-mode dependency (file: link)
        id: dev-mode
        run: |
          if grep -q '"@thread-memory/core": "file:' package.json; then
            echo "dev-mode=1" >> "$GITHUB_OUTPUT"
            echo "dev mode: @thread/core via file: link — CI skipped until core publishes to npm"
          else
            echo "dev-mode=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        if: steps.dev-mode.outputs.dev-mode == '0'
        run: pnpm install --frozen-lockfile
      - name: Build
        if: steps.dev-mode.outputs.dev-mode == '0'
        run: pnpm build
      - name: Typecheck
        if: steps.dev-mode.outputs.dev-mode == '0'
        run: pnpm typecheck
      - name: Lint
        if: steps.dev-mode.outputs.dev-mode == '0'
        run: pnpm lint
      - name: Test
        if: steps.dev-mode.outputs.dev-mode == '0'
        run: pnpm test

  # dsh-thread compat 矩阵（发布门槛：钉版本 + 随 dsh release train 持续适配）。
  # dsh preview 出新版本时在 matrix 追加，验证插件 API 编译期兼容。
  # 与 check 同样受 dev-mode guard 约束（core 未发布 npm 前无法独立安装）。
  compat-dsh:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dsh-version: [0.1.0-rc.6]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Check dev-mode dependency (file: link)
        id: dev-mode
        run: |
          if grep -q '"@thread/core": "file:' package.json; then
            echo "dev-mode=1" >> "$GITHUB_OUTPUT"
            echo "dev mode: CI skipped until core publishes to npm"
          else
            echo "dev-mode=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        if: steps.dev-mode.outputs.dev-mode == '0'
        run: pnpm install --frozen-lockfile
      - name: Build
        if: steps.dev-mode.outputs.dev-mode == '0'
        run: pnpm build
      - name: Typecheck against pinned dsh version
        if: steps.dev-mode.outputs.dev-mode == '0'
        run: pnpm typecheck
        env:
          DSH_VERSION: ${{ matrix.dsh-version }}
